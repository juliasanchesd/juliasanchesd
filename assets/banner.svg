<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1a"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- left: identity -->
    <text x="72" y="96" font-size="30" font-weight="700" fill="url(#accent)">&lt;/&gt;</text>
    <rect x="128" y="85" width="140" height="2" fill="#c084fc" opacity="0.5"/>

    <text x="70" y="178" font-size="72" font-weight="800" fill="#f5f3ff">Júlia <tspan fill="url(#accent)">Sanches</tspan></text>
    <text x="72" y="226" font-size="30" font-weight="500" fill="#c4b5fd">Web Developer + Project Manager</text>
    <text x="72" y="270" font-size="19" fill="#a1a1b5">Shopify · TypeScript · Cypress · Agile · Scrum · Generative AI</text>
    <rect x="72" y="292" width="64" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- chips -->
    <g font-size="15" font-weight="600">
      <rect x="72" y="320" width="96" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="120" y="345" text-anchor="middle" fill="#86efac">Shopify</text>
      <rect x="180" y="320" width="80" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="220" y="345" text-anchor="middle" fill="#93c5fd">TS</text>
      <rect x="272" y="320" width="108" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="326" y="345" text-anchor="middle" fill="#fca5a5">Cypress</text>
      <rect x="392" y="320" width="80" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="432" y="345" text-anchor="middle" fill="#fde68a">Agile</text>
      <rect x="484" y="320" width="96" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c084fc" stroke-opacity="0.35"/>
      <text x="532" y="345" text-anchor="middle" fill="#f0abfc">AI ✦</text>
    </g>

    <!-- right: sprint board -->
    <g transform="translate(770,70)">
      <rect width="440" height="290" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#c084fc" stroke-opacity="0.3"/>
      <circle cx="22" cy="22" r="5" fill="#f472b6"/>
      <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
      <circle cx="58" cy="22" r="5" fill="#4ade80"/>
      <text x="420" y="27" text-anchor="end" font-size="13" fill="#a1a1b5">sprint board</text>

      <g font-size="12" font-weight="700" fill="#c4b5fd">
        <text x="22" y="62">TO DO</text>
        <text x="162" y="62">DOING</text>
        <text x="302" y="62">DONE</text>
      </g>

      <!-- to do -->
      <rect x="18" y="74" width="124" height="54" rx="8" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="28" y="88" width="80" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.55"/>
      <rect x="28" y="104" width="56" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.25"/>
      <rect x="18" y="138" width="124" height="54" rx="8" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="28" y="152" width="94" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.55"/>
      <rect x="28" y="168" width="40" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.25"/>

      <!-- doing -->
      <rect x="158" y="74" width="124" height="70" rx="8" fill="#a855f7" fill-opacity="0.22" stroke="#c084fc" stroke-opacity="0.6"/>
      <rect x="168" y="88" width="88" height="7" rx="3.5" fill="#f5f3ff" fill-opacity="0.75"/>
      <rect x="168" y="104" width="60" height="7" rx="3.5" fill="#f5f3ff" fill-opacity="0.35"/>
      <rect x="168" y="124" width="104" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="168" y="124" width="66" height="6" rx="3" fill="url(#accent)"/>

      <!-- done -->
      <g>
        <rect x="298" y="74" width="124" height="46" rx="8" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="314" cy="97" r="7" fill="#4ade80" fill-opacity="0.85"/>
        <path d="M310.5 97l2.5 2.5 4.5-5" stroke="#0d0b1a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="328" y="93" width="76" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.35"/>
        <rect x="298" y="128" width="124" height="46" rx="8" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="314" cy="151" r="7" fill="#4ade80" fill-opacity="0.85"/>
        <path d="M310.5 151l2.5 2.5 4.5-5" stroke="#0d0b1a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="328" y="147" width="60" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.35"/>
        <rect x="298" y="182" width="124" height="46" rx="8" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="314" cy="205" r="7" fill="#4ade80" fill-opacity="0.85"/>
        <path d="M310.5 205l2.5 2.5 4.5-5" stroke="#0d0b1a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="328" y="201" width="70" height="7" rx="3.5" fill="#e9d5ff" fill-opacity="0.35"/>
      </g>

      <!-- code snippet card -->
      <rect x="18" y="206" width="264" height="66" rx="8" fill="#0d0b1a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="32" y="232" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f472b6">{%</text>
      <text x="54" y="232" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c4b5fd">section</text>
      <text x="114" y="232" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#86efac">'hero'</text>
      <text x="166" y="232" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f472b6">%}</text>
      <text x="32" y="256" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6b6b80">// shipped on time ✓</text>
    </g>
  </g>
</svg>
